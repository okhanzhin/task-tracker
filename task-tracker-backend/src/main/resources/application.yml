server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: task-tracker-backend
  management:
    endpoints:
      web:
        exposure:
          include: health,info
  profiles:
    active: default
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:tasks-db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      schema: ${APP_SCHEMA:task_tracker}
  jpa:
    show-sql: true
    properties:
      hibernate:
        default_schema: ${APP_SCHEMA:task_tracker}
        ddl-auto: validate
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    default-schema: ${spring.datasource.hikari.schema}
    liquibase-schema: ${SPRING_LIQUIBASE_LIQUIBASE_SCHEMA:tasks_liquibase}
    change-log: classpath:/db/changelog/db.changelog-master.yaml
jwt:
  secret: ${JWT_SECRET:K7q7NnSAx5ogW6MM0G0YvYsw7WXvYDY12E5tTBaVyX8=}
  lifetime: ${JWT_EXPIRATION:PT1H}
