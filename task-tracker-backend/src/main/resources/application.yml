server:
  port: ${APP_PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: task-tracker-backend
  management:
    endpoints:
      web:
        exposure:
          include: health,info
  profiles:
    active: default
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:tasks-db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      schema: ${APP_SCHEMA:task_tracker}
  jpa:
    show-sql: true
    properties:
      hibernate:
        default_schema: ${APP_SCHEMA:task_tracker}
        ddl-auto: validate
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    default-schema: ${spring.datasource.hikari.schema}
    liquibase-schema: ${SPRING_LIQUIBASE_LIQUIBASE_SCHEMA:tasks_liquibase}
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.info.headers: false

app:
  kafka:
    topics:
      email-sending: ${EMAIL_SENDING_KAFKA_TOPIC:EMAIL_SENDING_TASKS}

jwt:
  secret: ${JWT_SECRET:K7q7NnSAx5ogW6MM0G0YvYsw7WXvYDY12E5tTBaVyX8=}
  lifetime: ${JWT_EXPIRATION:PT1H}
  service-lifetime: ${JWT_SERVICE_EXPIRATION:PT2160H} # перевыпускать токен для сервисов каждые 90 дней
