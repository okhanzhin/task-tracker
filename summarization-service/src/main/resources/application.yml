server:
  port: ${APP_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

spring:
    application:
        name: summarization-service
    profiles:
      active: default
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: ${KAFKA_CONSUMER_GROUP_ID:task-tracker-summarization}
        auto-offset-reset: earliest
        enable-auto-commit: false
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.use.type.headers: false
          spring.json.value.default.type: com.okhanzhin.task.tracker.common.model.messaging.summarization.SummarizationRequest
          spring.json.trusted.packages: com.okhanzhin.task.tracker.common.model.messaging.summarization
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        acks: all
        properties:
          enable.idempotence: true
          spring.json.add.type.headers: false
      listener:
        ack-mode: record
        concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

app:
    kafka:
        enabled: true
        topics:
          summarization-request-topic: ${SUMMARIZATION_REQUEST_KAFKA_TOPIC:SUMMARIZATION_REQUESTS}
          summarization-response-topic: ${SUMMARIZATION_RESPONSE_KAFKA_TOPIC:SUMMARIZATION_RESPONSES}
          partitions: ${KAFKA_TOPIC_PARTITIONS:3}
          replicas: ${KAFKA_TOPIC_REPLICAS:1}
        retry:
          max-retries: ${KAFKA_RETRY_MAX_RETRIES:3}
          initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
          multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
          max-interval-ms: ${KAFKA_RETRY_MAX_INTERVAL_MS:10000}