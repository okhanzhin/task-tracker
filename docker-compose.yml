services:
    postgresql:
        image: postgres:16.4
        container_name: postgresql
        ports:
        - '5432:5432'
        restart: always
        environment:
          POSTGRES_USER: ${PG_USERNAME}
          POSTGRES_PASSWORD: ${PG_PASSWORD}
          POSTGRES_DB: tasks-db
          LIQUIBASE_SCHEMA: ${LIQUIBASE_SCHEMA:-tasks_liquibase}
        volumes:
        - postgres_db:/var/lib/postgresql/data
        - ./postgres/init/01-create-liquibase-schema.sql:/docker-entrypoint-initdb.d/01-create-liquibase-schema.sql:ro
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U ${PG_USERNAME}" ]
          interval: 20s
          timeout: 5s
          retries: 3
        networks:
        - task-tracker

    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: zookeeper
        hostname: zookeeper
        restart: on-failure
        ports:
        - '2181:2181'
        environment:
          ZOOKEEPER_CLIENT_PORT: 2181
          ALLOW_ANONYMOUS_LOGIN: "yes"
        networks:
        - task-tracker

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: kafka
        hostname: kafka
        restart: on-failure
        depends_on:
        - zookeeper
        ports:
        - '9092:9092'
        environment:
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
          KAFKA_TOPIC: EMAIL_SENDING_TASKS
          ALLOW_PLAINTEXT_LISTENER: yes
        networks:
        - task-tracker

    task-tracker-backend:
        build:
          context: .
          dockerfile: task-tracker-backend/Dockerfile
        container_name: task-tracker-backend
        restart: on-failure
        ports:
        - '8080:8080'
        environment:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB}
          SPRING_DATASOURCE_USERNAME: ${PG_USERNAME}
          SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
          SPRING_LIQUIBASE_LIQUIBASE_SCHEMA: ${LIQUIBASE_SCHEMA:-tasks_liquibase}
          JWT_SECRET: ${JWT_SECRET}
          JWT_EXPIRATION: ${JWT_EXPIRATION}
        depends_on:
          postgresql:
            condition: service_healthy
        networks:
        - task-tracker

volumes:
  postgres_db:
    driver: local

networks:
  task-tracker:
    driver: bridge